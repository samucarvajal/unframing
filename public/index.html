<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unframing</title>
    <meta name="description" content="A collaborative real-time drawing canvas.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="canvas-container">
        <canvas id="drawingCanvas" width="2880" height="1800" aria-label="Shared drawing canvas"></canvas>
    </div>

    <div id="colors" role="toolbar" aria-label="Colour palette">
        <button type="button" class="color-dot" style="background: #1d1d1d" aria-label="Black"></button>
        <button type="button" class="color-dot" style="background: #61bb46" aria-label="Green"></button>
        <button type="button" class="color-dot" style="background: #fdb827" aria-label="Yellow"></button>
        <button type="button" class="color-dot" style="background: #f5821f" aria-label="Orange"></button>
        <button type="button" class="color-dot" style="background: #e03a3e" aria-label="Red"></button>
        <button type="button" class="color-dot" style="background: #963d97" aria-label="Purple"></button>
        <button type="button" class="color-dot" style="background: #009ddc" aria-label="Blue"></button>
    </div>

    <!-- Served by the Socket.IO server itself, so client and server versions always match -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
